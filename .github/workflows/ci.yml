name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the database and API
        run: docker compose up --build --detach --wait db api
      - name: Build the estate
        run: npm run seed
      - run: npm run verify
      - run: npm run lint:api
      - run: npm run test:api
      - run: npm run lint:web
      - run: npm run test:web
      - name: Record the scene fallbacks, which the playback test needs
        run: npm run record
      - name: Browser journey, accessibility and timings
        run: npm run e2e
