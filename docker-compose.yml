services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      STUDIO_DATABASE_URL: postgresql+psycopg://studio:studio@db:5432/studio
      STUDIO_LLM_MODE: ${STUDIO_LLM_MODE:-replay}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STUDIO_STORAGE_ROOT: /workspace/storage
      PYTHONPATH: /workspace:/workspace/apps/api
    volumes:
      - .:/workspace
    working_dir: /workspace/apps/api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /workspace/apps/api/app --reload-dir /workspace/engines"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: node:22-alpine
    working_dir: /workspace/apps/web
    environment:
      API_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1500"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "5183:5183"
    depends_on:
      api:
        condition: service_healthy

  # The production build, which is what the timings measure. Use this on stage: npm run demo.
  demo:
    profiles: ["demo"]
    image: node:22-alpine
    working_dir: /workspace/apps/web
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
    command: sh -c "npm install --no-audit --no-fund --silent && npx vite build --logLevel warn && npx vite preview --host 0.0.0.0"
    ports:
      - "5184:5184"
    depends_on:
      api:
        condition: service_healthy

  # Runs against the production build. Started by npm run e2e, never by npm run dev.
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    working_dir: /workspace/apps/web
    environment:
      API_PROXY_TARGET: http://api:8000
      RECORD: ${RECORD:-}
    volumes:
      - .:/workspace
      - e2e_node_modules:/workspace/apps/web/node_modules
    command: sh -c "npm install --no-audit --no-fund --silent && npx vite build --logLevel warn && (npx vite preview --host 0.0.0.0 > /dev/null 2>&1 &) && sleep 3 && npx playwright test"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  web_node_modules:
  e2e_node_modules:
