# Test Assurance Studio (use case 2). Runs beside Migration Studio without sharing anything:
# its own project name, database, volumes and ports.
name: test-assurance

services:
  qe-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qe
      POSTGRES_PASSWORD: qe
      POSTGRES_DB: qe
    ports:
      - "5554:5432"
    volumes:
      - qe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qe -d qe"]
      interval: 3s
      timeout: 3s
      retries: 20

  qe-api:
    build:
      context: .
      dockerfile: apps/qe-api/Dockerfile
    environment:
      QE_DATABASE_URL: postgresql+psycopg://qe:qe@qe-db:5432/qe
      QE_LLM_MODE: ${QE_LLM_MODE:-replay}
      QE_LAB_URL: http://lab-runner:5390
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PYTHONPATH: /workspace:/workspace/apps/qe-api
    volumes:
      - .:/workspace
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8030 --reload --reload-dir /workspace/apps/qe-api/app --reload-dir /workspace/qe/engines"
    ports:
      - "8030:8030"
    depends_on:
      qe-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8030/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  qe-web:
    image: node:22-alpine
    working_dir: /workspace/apps/qe-web
    environment:
      API_PROXY_TARGET: http://qe-api:8030
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1500"
    volumes:
      - .:/workspace
      - qe_web_node_modules:/workspace/apps/qe-web/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "5193:5193"
    depends_on:
      qe-api:
        condition: service_healthy

  # The workbench as presented: a production build on 5194 (npm run qe:demo). The rehearsal runs against it.
  qe-web-demo:
    profiles: ["demo", "rehearsal"]
    image: node:22-alpine
    working_dir: /workspace/apps/qe-web
    environment:
      API_PROXY_TARGET: http://qe-api:8030
    volumes:
      - .:/workspace
      - qe_web_node_modules:/workspace/apps/qe-web/node_modules
    command: sh -c "npm install --no-audit --no-fund && npx vite build --logLevel warn && npx vite preview --host 0.0.0.0"
    ports:
      - "5194:5194"
    depends_on:
      qe-api:
        condition: service_healthy

  # The billing module itself, for people to use. Every lab run starts its own copy instead.
  module:
    build:
      context: .
      dockerfile: qe/lab/Dockerfile
    image: qe-lab
    command: ["--serve", "baseline", "--port", "5280"]
    ports:
      - "5280:5280"

  # Runs one check on request from the workbench: the live run in the Proof scene.
  lab-runner:
    image: qe-lab
    command: ["--listen", "5390"]
    volumes:
      - ./qe/estate/tests/e2e:/estate/tests/e2e:ro
      - ./qe/generated:/estate/generated:ro
      - ./qe/lab/run.mjs:/lab/run.mjs:ro

  # The rehearsal of the whole journey against the workbench: npm run qe:rehearse.
  # Uses the lab image's Playwright and browsers, so it needs no install of its own.
  rehearsal:
    profiles: ["rehearsal"]
    image: qe-lab
    entrypoint: ["sh", "-c"]
    command:
      - mkdir -p /tmp/e2e && cp -r /workspace/apps/qe-web/e2e/. /tmp/e2e && ln -sfn /lab/tests/node_modules /tmp/e2e/node_modules && cd /tmp/e2e && npx playwright test
    environment:
      RECORD: ${RECORD:-}
      APP_URL: http://qe-web-demo:5194
    volumes:
      - .:/workspace
    depends_on:
      - qe-web-demo

  # Runs tests against the module's builds: npm run qe:lab -- --builds baseline --runs 20
  lab:
    profiles: ["lab"]
    image: qe-lab
    volumes:
      - ./qe/estate/tests/e2e:/estate/tests/e2e:ro
      - ./qe/generated:/estate/generated:ro
      - ./qe/lab/results:/results
      # The harness itself, so a change to it needs no rebuild of every build in the image.
      - ./qe/lab/run.mjs:/lab/run.mjs:ro

volumes:
  qe_pgdata:
  qe_web_node_modules:
