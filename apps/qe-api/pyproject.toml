[project]
name = "test-assurance-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.13,<2",
  "anthropic>=2.3,<3",
  "fastapi>=0.121,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.4,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0.30,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
